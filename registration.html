<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
     <link rel="stylesheet" type="text/css" href="style.css">
      <link rel="stylesheet" type="text/css" href="form.css">
    <style>
        .form{
            width: 50%;
            margin-left: 25%;
            border: 6px solid blanchedalmond;
            border-radius: 6px;
            padding: 30px;
            min-height: 200px;
            font-size: larger;
        }
        
    </style>
</head>
<body>
    <form action="backend.pyp">
        <fieldset class="form">
            <legend>Personal Informaton</legend>
            <label for="name">Name: </label>
            <input type="text" id="name" required placeholder="Enter your Name" autofocus><br><br><br>
            <label for="mobnum">Mobile Number: </label>
            <input type="number" id="mobnum" required pattern="[0-9]{10}" placeholder="Enter a number"><br><br><br>
            <label for="email">Email: </label>
            <input type="email" id="email" required placeholder="Enter an email">
        </fieldset>
        <fieldset class="form">
            <legend>Plot Informaton</legend>
            <label for="PID">Plot ID</label>
            <input type="text" id="PID" required placeholder="Enter your Plot ID"><br><br><br>
            <label for="village">Village: </label>
            <input type="text"  id="village" required placeholder="Enter your village here"><br><br><br>
            <label for="date">Date Of Registration</label>
            <input type="date" id="date" required><br><br><br>
            <label for="photo">Upload your Farm Photo</label>
            <input type="file" id="photo" required>
        </fieldset>
        <fieldset class="form">
            <legend>Farming Informaton</legend>
            <label for="c-stage">Crop Stage</label>
            <textarea id="c-stage" placeholder="Tell us about your crop" required></textarea><br><br><br>
            <label for="soiltype">Soil type</label>
            <input type="text" id="soiltype" placeholder="Tell us about your soil type"required><br><br><br>
            <button style="border-radius: 6px;"><input type="submit"></button>
            <button style="border-radius: 6px;"><input type="reset"></button>
        </fieldset>
    </form>
</body>
</html>
