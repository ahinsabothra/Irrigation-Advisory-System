<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="form.css">
    <style>
        .form {
            width: 50%;
            margin-left: 25%;
            border: 6px solid blanchedalmond;
            border-radius: 6px;
            padding: 30px;
            min-height: 200px;
            font-size: larger;
        }

        .error {
            border: 2px solid red;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-left: 10px;
        }

        .success-message {
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>TEST - NEW VERSION</h1>

    <form id="farmerForm" action="backend.pyp">
        <fieldset class="form">
            <legend>Personal Information</legend>

            <label for="name">Name: </label>
            <input type="text" id="name" name="name" required placeholder="Enter your Name" autofocus>
            <span id="nameError" class="error-message"></span><br><br><br>

            <label for="mobnum">Mobile Number: </label>
            <input type="text" id="mobnum" name="mobnum" required placeholder="Enter a 10-digit number">
            <span id="mobnumError" class="error-message"></span><br><br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required placeholder="Enter an email">
            <span id="emailError" class="error-message"></span>
        </fieldset>

        <fieldset class="form">
            <legend>Plot Information</legend>

            <label for="PID">Plot ID</label>
            <input type="text" id="PID" name="PID" required placeholder="AGR-1234">
            <span id="PIDError" class="error-message"></span><br><br><br>

            <label for="village">Village: </label>
            <input type="text" id="village" name="village" required placeholder="Enter your village here">
            <span id="villageError" class="error-message"></span><br><br><br>

            <label for="date">Date Of Registration</label>
            <input type="date" id="date" name="date" required>
            <span id="dateError" class="error-message"></span><br><br><br>

            <label for="photo">Upload your Farm Photo</label>
            <input type="file" id="photo" name="photo" required><br><br>
        </fieldset>

        <fieldset class="form">
            <legend>Farming Information</legend>

            <label for="c-stage">Crop Stage</label>
            <select id="c-stage" name="cropStage" required>
                <option value="">Select Crop Stage</option>
                <option value="germination">Germination</option>
                <option value="vegetative">Vegetative</option>
                <option value="flowering">Flowering</option>
                <option value="maturity">Maturity</option>
                <option value="harvesting">Harvesting</option>
            </select>
            <span id="cropStageError" class="error-message"></span><br><br><br>

            <label for="soiltype">Soil Type</label>
            <select id="soiltype" name="soiltype" required>
                <option value="">Select Soil Type</option>
                <option value="black">Black Soil</option>
                <option value="clayey">Clayey Soil</option>
                <option value="sandy">Sandy Soil</option>
                <option value="loamy">Loamy Soil</option>
                <option value="silty">Silty Soil</option>
            </select>
            <span id="soilTypeError" class="error-message"></span><br><br><br>

            <label for="irrigation">Irrigation Method</label>
            <select id="irrigation" name="irrigation" required>
                <option value="">Select Irrigation Method</option>
                <option value="drip">Drip Irrigation</option>
                <option value="sprinkler">Sprinkler Irrigation</option>
                <option value="flood">Flood Irrigation</option>
                <option value="furrow">Furrow Irrigation</option>
            </select>
            <span id="irrigationError" class="error-message"></span><br><br><br>

            <label for="soilMoisture">Soil Moisture (%)</label>
            <input type="number" id="soilMoisture" name="soilMoisture" min="0" max="100" placeholder="Enter 0-100">
            <span id="soilMoistureError" class="error-message"></span><br><br><br>

            <label for="irrigationDate">Irrigation Date</label>
            <input type="date" id="irrigationDate" name="irrigationDate" required>
            <span id="irrigationDateError" class="error-message"></span><br><br><br>

            <button type="submit" style="border-radius: 6px;">Submit</button>
            <button type="reset" style="border-radius: 6px;">Reset</button>

            <p id="successMessage" class="success-message"></p>
        </fieldset>
    </form>

    <script>
        const form = document.getElementById("farmerForm");

        function showError(field, errorElement, message) {
            errorElement.textContent = message;
            field.classList.add("error");
            return false;
        }

        function validateName() {
            const name = document.getElementById("name");
            const error = document.getElementById("nameError");
            name.value = name.value.trim();

            if (name.value === "") {
                return showError(name, error, "Name is required.");
            }

            if (!/^[A-Za-z ]+$/.test(name.value)) {
                return showError(name, error, "Name should contain alphabets and spaces only.");
            }

            return true;
        }

        function validateMobile() {
            const mobile = document.getElementById("mobnum");
            const error = document.getElementById("mobnumError");
            mobile.value = mobile.value.trim();

            if (!/^[0-9]{10}$/.test(mobile.value)) {
                return showError(mobile, error, "Mobile number must contain exactly 10 digits.");
            }

            return true;
        }

        function validatePlotID() {
            const plot = document.getElementById("PID");
            const error = document.getElementById("PIDError");
            plot.value = plot.value.trim();

            if (!/^AGR-[0-9]{4}$/.test(plot.value)) {
                return showError(plot, error, "Plot ID must be in the format AGR-1234.");
            }

            return true;
        }

        function validateSoilMoisture() {
            const moisture = document.getElementById("soilMoisture");
            const error = document.getElementById("soilMoistureError");

            if (moisture.value === "") {
                return showError(moisture, error, "Soil Moisture is required.");
            }

            if (moisture.value < 0 || moisture.value > 100) {
                return showError(moisture, error, "Soil Moisture must be between 0 and 100%.");
            }

            return true;
        }

        function validateCropStage() {
            const cropStage = document.getElementById("c-stage");
            const error = document.getElementById("cropStageError");

            if (cropStage.value === "") {
                return showError(cropStage, error, "Please select a Crop Stage.");
            }

            return true;
        }

        function validateIrrigationDate() {
            const date = document.getElementById("irrigationDate");
            const error = document.getElementById("irrigationDateError");

            if (date.value === "") {
                return showError(date, error, "Irrigation Date is required.");
            }

            return true;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const fields = document.querySelectorAll("input, select");
            const errors = document.querySelectorAll(".error-message");

            fields.forEach(function(field) {
                field.classList.remove("error");
            });

            errors.forEach(function(error) {
                error.textContent = "";
            });

            document.getElementById("successMessage").textContent = "";

            const validName = validateName();
            const validMobile = validateMobile();
            const validPlotID = validatePlotID();
            const validSoilMoisture = validateSoilMoisture();
            const validCropStage = validateCropStage();
            const validIrrigationDate = validateIrrigationDate();

            const village = document.getElementById("village");
            const villageError = document.getElementById("villageError");

            if (village.value.trim() === "") {
                showError(village, villageError, "Village is required.");
            }

            const email = document.getElementById("email");
            const emailError = document.getElementById("emailError");

            if (email.value.trim() === "") {
                showError(email, emailError, "Email is required.");
            } else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email.value.trim())) {
                showError(email, emailError, "Enter a valid email address.");
            }

            const date = document.getElementById("date");
            const dateError = document.getElementById("dateError");

            if (date.value === "") {
                showError(date, dateError, "Registration Date is required.");
            } else {
                const selectedDate = new Date(date.value);
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                if (selectedDate > today) {
                    showError(date, dateError, "Registration Date cannot be in the future.");
                }
            }

            const irrigation = document.getElementById("irrigation");
            const irrigationError = document.getElementById("irrigationError");

            if (irrigation.value === "") {
                showError(irrigation, irrigationError, "Please select an Irrigation Method.");
            }

            const photo = document.getElementById("photo");

            if (photo.files.length === 0) {
                photo.classList.add("error");
            }

            const allErrors = document.querySelectorAll(".error");

            if (
                validName &&
                validMobile &&
                validPlotID &&
                validSoilMoisture &&
                validCropStage &&
                allErrors.length === 0
            ) {
                document.getElementById("successMessage").textContent =
                    "Registration successful!";
            }
        });

        form.addEventListener("reset", function() {
            setTimeout(function() {
                document.querySelectorAll(".error").forEach(function(field) {
                    field.classList.remove("error");
                });

                document.querySelectorAll(".error-message").forEach(function(error) {
                    error.textContent = "";
                });

                document.getElementById("successMessage").textContent = "";
            }, 0);
        });
    </script>
</body>
</html>
