<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Dashboard</title>
     <link rel="stylesheet" type="text/css" href="style.css">
     <link rel="stylesheet" type="text/css" href="nav.css">
</head>
<style>
    

    section {
        padding: 20px;
        margin: 20px;
        background-color: #817171;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    

    
    
</style>
<body>
    <h1>Farm Gallery</h1>
    <section>
        <h2>Farm Images</h2>
        <div class="gallery">
            <img src="https://cdn.britannica.com/23/126823-050-820B0A1F/Field-sugarcane-St-George-Parish-Barbados.jpg" alt="Healthy Sugarcane Crop" height="200" width="300"><figure>
                <figcaption><b>Healthy Sugarcane Crop</b></figcaption>
            </figure>
            <img src="https://www.rungtairrigation.in/wp-content/uploads/2024/10/online-drip-irrigation-system.jpg" alt="Drip Irrigation System" height="200" width="300"><figure>
                <figcaption><b>Drip Irrigation System</b></figcaption>
            </figure>
            <img src="https://circuit.rocks/cdn/shop/products/soil-moisture-sensor-analog-digital-109.jpg?v=1689317175" alt="Soil Moisture Sensor" height="200" width="300"><figure>
                <figcaption><b>Soil Moisture Sensor</b></figcaption>
            </figure>
            <img src="https://5.imimg.com/data5/SELLER/Default/2021/7/HX/VH/BZ/10005101/automatic-weather-monitoring-station-500x500.jpg" alt="Weather Monitoring Station" height="200" width="300"><figure>
                <figcaption><b>Weather Monitoring Station</b></figcaption>
            </figure>
        </div>
        </section>
        <figure>
            <img src="https://storage.icograms.com/templates/thumbnails/lavender-festival.png" alt="Farm map" usemap="#plot">
            <map name="plot">
                <area shape="poly" coords="0,154,178,62,296,113,369,115,151,232" href="https://www.google.com/" alt=""> <!--Plot A -->
                <area shape="poly" coords="298,165,380,126,451,162,366,203" href="https://www.facebook.com/" alt="">      <!--Plot B -->
                <area shape="poly" coords="191,53,303,110,388,102,408,90,411,58,334,22,247,14" href="https://www.wikipedia.org/" alt="">    <!--Settelment-->
                
            </map>
        <figcaption><b>Plot-Map</b></figcaption>    
    </figure>
</body>
</html>
